<html lang="en">
<head>
    <title>Song Chord Guide Sample</title>
    <script type="text" id="content-template">

        [Verse 1]
        {E}I {Esus4}know You’ve given all I need  {A}

        The only reason that I {C#m}live
        The only reason that I f{A}ollow... o{B}hooh.

        [Pre-Chorus]
        {C#m}You capture{A}d me today, Je{B}sus
        {C#m}You complete{A}d all my days,{B} ohooh.

        [Chorus x2]

        [Bridge x2]

    </script>
    <!-- DO NOT CHANGE ANYTHING BEYOND THIS POINT UNLESS YOU KNOW WHAT YOU ARE DOING -->
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width"/>
    <style>
        html,
        body *:not(script) {
            box-sizing: border-box;
        }

        body {
            background: #333;
            font-family: "monospace";
            font-size: 10pt;
        }

        #content {
            background: #fff;
            column-fill: auto;
            column-count: 2;
            column-gap: 0.2in;
        }

        @media only print {
            @page {
                margin: 0.5in;
            }
        }

        @media only screen {
            #content {
                white-space: pre-wrap;
                padding: 0.5in;
                margin: 0 auto;
                width: 8.5in;
                min-height: 11in;
                margin-top: 0.5in;
                margin-bottom: 0.5in;
            }
        }

        .title {
            font-weight: bold;
            text-decoration: underline;
        }

        .artist {
            font-weight: bold;
        }

        .section-label {
            line-height: 1.5rem;
            break-after: avoid;
        }

        .line {
            position: relative;
            line-height: 3rem;
            break-inside: avoid-page;
        }

        .chord {
            font-weight: bold;
            position: absolute;
            line-height: 1em;
            /*transform: translateY(-1.3rem);*/
        }

        .chord.inline {
            position: relative;
            transform: none;
        }
    </style>
</head>

<body>
<div id="content"></div>
<script type="text/javascript">
    // TODO: page break token
    // TODO: column break token
    /** @type {HTMLElement} */
    const contentEl = document.getElementById("content");
    /** @type {HTMLElement} */
    const templateEl = document.getElementById("content-template");
    /** @type {string} */
    const template = templateEl.textContent.trim();

    const TemplateTokens = {
        BREAK: "@break",
        TITLE: {
            regexp: /@title:\s*(?<title>[^\n]+)/,
            groups: {
                title: "title",
            },
            /**
             * @param {string} str
             * @return {string | undefined}
             */
            tryTransform(str) {
                const result = this.regexp.exec(str);
                /** @type {string | undefined} */
                const title = result?.groups[this.groups.title];
                return title && `<div class="title">${title}</div>`;
            },
        },
        ARTIST: {
            regexp: /@artist:\s*(?<artist>[^\n]+)/,
            groups: {
                artist: "artist",
            },
            /**
             * @param {string} str
             * @return {string | undefined}
             */
            tryTransform(str) {
                const result = this.regexp.exec(str);
                /** @type {string | undefined} */
                const artist =
                    result?.groups[this.groups.artist];
                return artist && `<div class="artist">${artist}</div>`;
            },
        },
        INLINE_CHORDS: {
            regexp: /@inline:\s*(?<inline_chords>[^\n]+)/,
            groups: {
                inlineChords: "inline_chords",
            },
            /**
             * @param {string} str
             * @return {string | undefined}
             */
            tryTransform(str) {
                const result = this.regexp.exec(str);
                /** @type {string | undefined} */
                const inlineChords =
                    result?.groups[this.groups.inlineChords];
                return (
                    inlineChords &&
                    `<div class="inline chord">&nbsp;${inlineChords}</div>`
                );
            },
        },
        SECTION_LABEL: {
            regexp: /\[(?<label_str>[^\]]+)]/g,
            groups: {
                labelStr: "label_str",
            },
            /**
             * @param {string} str
             * @return {string | undefined}
             */
            tryTransform(str) {
                const result = this.regexp.exec(str);
                /** @type {string | undefined} */
                const label =
                    result?.groups[this.groups.labelStr];
                return label && `<div class="section-label">[${label}]</div>`;
            },
        },
        EMBEDDED_CHORDS: {
            regexp: /\{(?<chord_str>[^}]+)}/g,
            groups: {
                chordStr: "chord_str",
            },
            /**
             * @param {string} str
             */
            tryTransform(str) {
                const result = str.replaceAll(
                    this.regexp,
                    (m, p) => {
                        console.log("@replaceAll", m, "-->", p);
                        return `<span class="chord">${p}</span>`;
                    },
                );

                return `<div class="line">${result}</div>`;
            },
        },
        /**
         * @param {string} str
         * @return {string}
         */
        tryTransform(str) {
            return this.TITLE.tryTransform(str) ||
                this.ARTIST.tryTransform(str) ||
                this.INLINE_CHORDS.tryTransform(str) ||
                this.SECTION_LABEL.tryTransform(str) ||
                this.EMBEDDED_CHORDS.tryTransform(str)
        }
    };

    const splits = template.split("@break").map((e) => e.trim());
    console.log("splits", splits);

    const htmlStr = splits
        .map((split) => {
            const lines = split
                .split("\n")
                .map((e) => e.trim())
                .filter((s) => s.length > 0);
            console.log("unprocessed:", lines);
            const result = lines.map(line => TemplateTokens.tryTransform(line));
            console.log("processed:", result);
            return result.join("");
        })
        .join("<br/>");

    contentEl.innerHTML = htmlStr;
</script>
</body>
</html>
