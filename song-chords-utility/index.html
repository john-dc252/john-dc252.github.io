    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width"/>
    <style>
        html,
        body *:not(script) {
            box-sizing: border-box;
        }

        body {
            background: #333;
            font-family: "monospace";
            font-size: 10pt;
        }

        .page {
            background: #fff;
            column-fill: auto;
            column-count: 2;
            column-gap: 0.2in;
        }

        @media only print {
            @page {
                margin: 0.5in;
            }
        }

        @media only screen {
            .page {
                white-space: pre-wrap;
                padding: 0.5in;
                width: 8.5in;
                height: 11in;
                margin: 0.5in auto;
            }
        }

        .title {
            font-weight: bold;
            text-decoration: underline;
        }

        .artist {
            font-weight: bold;
        }

        .section-label {
            line-height: 1.5rem;
            break-after: avoid;
        }

        .line {
            position: relative;
            line-height: 3rem;
            break-inside: avoid-page;
        }

        .chord {
            font-weight: bold;
            position: absolute;
            line-height: 1em;
            /*transform: translateY(-1.3rem);*/
        }

        .chord.inline {
            position: relative;
            transform: none;
        }
    </style>
</head>

<body>
<div id="content"></div>
<script type="text/javascript">
    // TODO: column break token
    /** @type {HTMLElement} */
    const contentEl = document.getElementById("content");
    /** @type {HTMLElement} */
    const templateEl = document.getElementById("content-template");
    /** @type {string} */
    const template = templateEl.textContent.trim();

    class LineParser {
        /**
         * @readonly
         * @type {RegExp}
         */
        regexp;
        /**
         * @readonly
         * @type {string}
         */
        captureName;
        /**
         * @type {(string) => string}
         */
        htmlFromString;
        /**
         * @param {string} input
         * @param {LineParser} parser
         * @return {string}
         */
        extractValue = (input, parser) => {
            const result = parser.regexp.exec(input);

            if (result && !parser.captureName) {
                // no value to extract, we will transform input to a fixed value
                return input;
            }

            const value = result?.groups[parser.captureName];
            return value ?? '';
        };

        /**
         * @param {RegExp} regexp
         * @param {string} [captureName]
         * @param {(string) => string} htmlFromString
         * @param {(i: string, p: LineParser) => string} [extractValue]
         */
        constructor(regexp, captureName, htmlFromString, extractValue = undefined) {
            this.regexp = regexp;
            this.captureName = captureName;
            this.htmlFromString = htmlFromString;

            if (extractValue) {
                this.extractValue = extractValue;
            }
        }

        /**
         * @param {string} str
         * @return {string} HTML string or empty string on failure
         */
        tryIntoHtml(str) {
            const value = this.extractValue(str, this);

            return value ? this.htmlFromString(value) : '';
        }
    }

    const EMPTY_LINE = new LineParser(/@empty_line/, undefined, () => '<br/>');
    const PAGE_BREAK_TOKEN = '@page_break';
    const PAGE_BREAK = new LineParser(/@page_break/, undefined, value => value);
    const TITLE = new LineParser(
        /@title:\s*(?<title>[^\n]+)/,
        'title',
        title => title && `<div class="title">${title}</div>`
    );
    const ARTIST = new LineParser(
        /@artist:\s*(?<artist>[^\n]+)/,
        'artist',
        artist => artist && `<div class="artist">${artist}</div>`
    );
    const SECTION_LABEL = new LineParser(
        /\[(?<label_str>[^\]\n]+)]/,
        'label_str',
        label => label && `<div class="section-label">[${label}]</div>`
    );
    const INLINE_CHORDS = new LineParser(
        /@inline:\s*(?<inline_chords>[^\n]+)/,
        'inline_chords',
        inlineChords => inlineChords && `<div class="inline chord">&nbsp;${inlineChords}</div>`
    );
    const EMBEDDED_CHORDS = new LineParser(
        /\{(?<chord_str>[^}]+)}/g,
        'chord_str',
        result => `<div class="line">${result}</div>`,
        (str, parser) => str.replaceAll(
            parser.regexp,
            (m, p) => {
                console.log("@replaceAll", m, "-->", p);
                return `<span class="chord">${p}</span>`;
            },
        )
    );

    const lineParsers = [
        EMPTY_LINE,
        PAGE_BREAK,
        TITLE,
        ARTIST,
        SECTION_LABEL,
        INLINE_CHORDS,
        EMBEDDED_CHORDS,
    ];

    /**
     * @param {string} str
     */
    function transformLineToHtml(str) {
        return lineParsers.reduce((acc, parser) => acc || parser.tryIntoHtml(str), '') ?? '';
    }

    const intermediateStr = template.split('\n')
        .map(line => line.trim())
        .filter(s => s.length > 0)
        .map(line => {
            console.log('unprocessed line:', line);
            const html = transformLineToHtml(line);
            console.log('processed:', html);
            return html;
        })
        .join("");

    const htmlStr = intermediateStr.split(PAGE_BREAK_TOKEN)
        .map(page => `<div class="page">${page}</div>`)
        .join('');

    contentEl.innerHTML = htmlStr;
</script>
</body>
</html>
