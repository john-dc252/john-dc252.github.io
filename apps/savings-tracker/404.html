<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savings Tracker</title>
  <link rel="icon" href="/apps/savings-tracker/favicon.ico">
  <script>
    // With hash routing, all routes live in the fragment — the server never
    // sees them. Just redirect to the app root; the router will handle the rest.
    window.location.replace('/apps/savings-tracker/');
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #212529;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1rem;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1d20; color: #dee2e6; }
      .card { background: #212529; border-color: #373b3e; }
    }

    .card {
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: .5rem;
    }

    p {
      font-size: .9rem;
      color: #6c757d;
      margin-bottom: 1.5rem;
    }

    @media (prefers-color-scheme: dark) {
      p { color: #adb5bd; }
    }

    .spinner {
      display: inline-block;
      width: 1.25rem;
      height: 1.25rem;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .4rem;
      opacity: .6;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .redirect-note {
      font-size: .8rem;
      color: #6c757d;
    }

    @media (prefers-color-scheme: dark) {
      .redirect-note { color: #adb5bd; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">💰</span>
    <h1>Savings Tracker</h1>
    <p>Redirecting you to the app…</p>
    <div class="redirect-note">
      <span class="spinner"></span>
      Please wait
    </div>
  </div>
</body>
</html>
